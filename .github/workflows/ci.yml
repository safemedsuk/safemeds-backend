name: Backend CI

on:
  pull_request:
    paths:
      - 'safemeds-backend/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'safemeds-backend/**'

defaults:
  run:
    working-directory: safemeds-backend

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: safemeds
          POSTGRES_PASSWORD: safemeds
          POSTGRES_DB: safemeds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safemeds -d safemeds_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: safemeds-backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare test env file
        run: cp .env.test.example .env.test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: E2E tests
        run: pnpm test:e2e
